<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мессенджер (Supabase)</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0f1115;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .login-box {
    display: none; /* Скрыто по умолчанию, показывается через JS */
    width: 100%;
    max-width: 420px;
    margin: auto;
    background: #161a22;
    border: 1px solid #262b36;
    border-radius: 16px;
    padding: 28px;
  }
  .login-box h1 { font-size: 22px; margin-bottom: 16px; text-align: center; }
  .login-box input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    background: #0f1115;
    border: 1px solid #262b36;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
  }
  .login-box input:focus { outline: none; border-color: #ff7a00; }
  .login-box button {
    width: 100%;
    padding: 13px;
    background: #ff7a00;
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .login-box button:hover { opacity: .85; }
  .login-box button.secondary { background: transparent; border: 1px solid #262b36; color: #fff; }
  .status { margin-top: 16px; font-size: 13px; color: #8a8f98; text-align: center; min-height: 18px; }

  .chat {
    display: none;
    flex-direction: column;
    height: 100vh;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    background: #0f1115;
  }
  .chat-header {
    padding: 16px 20px;
    background: #161a22;
    border-bottom: 1px solid #262b36;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-header .email { font-size: 14px; color: #8a8f98; }
  .chat-header button {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid #262b36;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  .chat-header button:hover { border-color: #ff7a00; color: #ff7a00; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .message.mine { align-self: flex-end; background: #ff7a00; color: #000; }
  .message.other { align-self: flex-start; background: #262b36; color: #fff; }
  .message .author { font-size: 11px; opacity: .7; display: block; margin-bottom: 4px; }
  .message .time { font-size: 10px; opacity: .6; display: block; margin-top: 4px; text-align: right; }
  .chat-input { display: flex; gap: 10px; padding: 16px 20px; background: #161a22; border-top: 1px solid #262b36; }
  .chat-input input { flex: 1; padding: 12px 14px; background: #0f1115; border: 1px solid #262b36; border-radius: 10px; color: #fff; font-size: 15px; }
  .chat-input input:focus { outline: none; border-color: #ff7a00; }
  .chat-input button { padding: 12px 22px; background: #ff7a00; border: none; border-radius: 10px; color: #000; font-weight: 600; cursor: pointer; }
  .chat-input button:hover { opacity: .85; }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h1>Мессенджер</h1>
  <input id="name" type="text" placeholder="Ваше имя (при регистрации)">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль (мин. 6 символов)">
  <button id="loginBtn">Войти</button>
  <button id="signupBtn" class="secondary">Зарегистрироваться</button>
  <p class="status" id="status"></p>
</div>

<div class="chat" id="chat">
  <div class="chat-header">
    <span class="email" id="userEmail"></span>
    <button id="logoutBtn">Выйти</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chat-input">
    <input id="messageInput" type="text" placeholder="Написать сообщение...">
    <button id="sendBtn">Отправить</button>
  </div>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

  const SUPABASE_URL = "https://nvjrhrebhlcnnxpjzylx.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52anJocmViaGxjbm54cGp6eWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3OTMyNTYsImV4cCI6MjExMDM2OTI1Nn0.BzdRl7PnKIa4HAw9jzPkptiAd9uN2xA_axIwCKdzLqE";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const firebaseConfig = {
    apiKey: "AIzaSyAk2qhmu4GJQozcU74_FNQWhzk4T7P-gPU",
    authDomain: "my-messenger-95eda.firebaseapp.com",
    projectId: "my-messenger-95eda",
    storageBucket: "my-messenger-95eda.firebasestorage.app",
    messagingSenderId: "327505492353",
    appId: "1:327505492353:web:3306144f22b8ac16eb9080"
  };
  const firebaseApp = initializeApp(firebaseConfig);
  const messaging = getMessaging(firebaseApp);

  const loginBox = document.getElementById('loginBox');
  const chat = document.getElementById('chat');
  const status = document.getElementById('status');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userEmail = document.getElementById('userEmail');
  const messagesEl = document.getElementById('messages');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  let currentUser = null;
  let currentUserName = '';
  let channel = null;

  loginBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { status.textContent = 'Введите email и пароль'; return; }
    status.textContent = 'Вход...';
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) status.textContent = 'Ошибка: ' + error.message;
    else status.textContent = '';
  });

  signupBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password || !name) { status.textContent = 'Заполните все поля'; return; }
    status.textContent = 'Регистрация...';
    const { error } = await supabase.auth.signUp({
      email, password, options: { data: { name: name } }
    });
    if (error) status.textContent = 'Ошибка: ' + error.message;
    else { status.textContent = 'Успешно! Теперь войдите.'; nameInput.value = ''; }
  });

  logoutBtn.addEventListener('click', async () => {
    if (channel) supabase.removeChannel(channel);
    await supabase.auth.signOut();
  });

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentUser) return;
    messageInput.value = '';
    const { error } = await supabase.from('messages').insert({
      text, author: currentUserName, uid: currentUser.id
    });
    if (error) alert('Ошибка отправки: ' + error.message);
  }
  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  supabase.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      currentUser = session.user; // ТЕПЕРЬ ПОЛЬЗОВАТЕЛЬ ТОЧНО ЕСТЬ
      currentUserName = currentUser.user_metadata.name || currentUser.email;
     
      loginBox.style.display = 'none';
      chat.style.display = 'flex';
      userEmail.textContent = 'Вы вошли как ' + currentUserName;

      loadMessages();
      setupNotifications();
    } else {
      currentUser = null;
      currentUserName = '';
      loginBox.style.display = 'block';
      chat.style.display = 'none';
      userEmail.textContent = '';
      messagesEl.innerHTML = '';
    }
  });

  // ФУНКЦИЯ ДЛЯ УВЕДОМЛЕНИЙ (вызывается только когда пользователь залогинен)
  async function setupNotifications() {
    if (Notification.permission === 'default') await Notification.requestPermission();
    if (Notification.permission !== 'granted') return;

    try {
      const swRegistration = await navigator.serviceWorker.register('service-worker.js');
      const currentToken = await getToken(messaging, {
        vapidKey: "BPnA8s44lJWJsYJdM303Uqpyx0jNgkKD0X_ywGKnnXFU1DB9spqNCP2iQRQNi_a4Q8C1UkGl_NzBgBvZb6-kTy8",
        serviceWorkerRegistration: swRegistration
      });

      if (currentToken) {
        console.log('Токен получен:', currentToken);
        const { error } = await supabase.from('push_tokens').upsert({
          user_id: currentUser.id, token: currentToken
        }, { onConflict: 'user_id' });
        if (error) console.error('Ошибка сохранения токена:', error);
        else console.log('Токен успешно сохранен в базе!');
      }
    } catch (err) { console.error('Ошибка получения токена:', err); }
  }

  function loadMessages() {
    if (channel) supabase.removeChannel(channel); // Убираем старую подписку, чтобы избежать ошибки

    supabase.from('messages').select('*').order('created_at', { ascending: true })
      .then(({ data, error }) => {
        if (error) return console.error(error);
        messagesEl.innerHTML = '';
        data.forEach(renderMessage);
        scrollToBottom();
      });

    channel = supabase.channel('custom-all-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
        (payload) => { renderMessage(payload.new); scrollToBottom(); }
      ).subscribe();
  }

  function renderMessage(msg) {
    const div = document.createElement('div');
    div.className = 'message ' + (msg.uid === currentUser.id ? 'mine' : 'other');
    let timeStr = '';
    if (msg.created_at) {
      const date = new Date(msg.created_at);
      timeStr = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }
    div.innerHTML = `<span class="author">${msg.author}</span>${msg.text}<span class="time">${timeStr}</span>`;
    messagesEl.appendChild(div);
  }

  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
  onMessage(messaging, (payload) => { console.log('Пуш на переднем плане:', payload); });
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(err => console.log(err));
  }
</script>

</body>
</html>
</body>
</html>
