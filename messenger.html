<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мессенджер (Supabase)</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0f1115;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .login-box {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: auto;
    background: #161a22;
    border: 1px solid #262b36;
    border-radius: 16px;
    padding: 28px;
  }
  .login-box h1 { font-size: 22px; margin-bottom: 16px; text-align: center; }
  .login-box input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    background: #0f1115;
    border: 1px solid #262b36;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
  }
  .login-box input:focus { outline: none; border-color: #ff7a00; }
  .login-box button {
    width: 100%;
    padding: 13px;
    background: #ff7a00;
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .login-box button:hover { opacity: .85; }
  .login-box button.secondary { background: transparent; border: 1px solid #262b36; color: #fff; }
  .status { margin-top: 16px; font-size: 13px; color: #8a8f98; text-align: center; min-height: 18px; }

  .app-container {
    display: none;
    flex-direction: column;
    height: 100vh;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    background: #0f1115;
  }
  .app-header {
    padding: 16px 20px;
    background: #161a22;
    border-bottom: 1px solid #262b36;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .app-header .email { font-size: 14px; color: #8a8f98; }
  .app-header button {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid #262b36;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  .app-header button:hover { border-color: #ff7a00; color: #ff7a00; }

  .contacts-screen { flex: 1; overflow-y: auto; padding: 20px; }
 
  .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
  .search-box input { flex: 1; padding: 12px; background: #161a22; border: 1px solid #262b36; border-radius: 10px; color: #fff; }
  .search-box input:focus { outline: none; border-color: #ff7a00; }
  .search-box button { padding: 0 20px; background: #ff7a00; border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; }

  .contact-item {
    display: flex; align-items: center; padding: 14px 20px;
    background: #161a22; border: 1px solid #262b36; border-radius: 12px;
    margin-bottom: 10px; cursor: pointer; transition: background 0.2s;
  }
  .contact-item:hover { background: #1f252f; border-color: #ff7a00; }
 
  /* Обертка для аватарки, чтобы позиционировать кружок */
  .avatar-wrapper { position: relative; margin-right: 15px; }
  .contact-avatar {
    width: 40px; height: 40px; background: #ff7a00; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #000; font-size: 18px;
  }
  /* Зеленый кружок в сети */
  .online-dot {
    position: absolute; bottom: 0; right: 0;
    width: 12px; height: 12px; background: #22c55e;
    border: 2px solid #161a22; border-radius: 50%;
    display: none; /* По умолчанию скрыт */
  }

  .contact-info { flex: 1; display: flex; flex-direction: column; }
  .contact-name { font-size: 16px; font-weight: 500; }
 
  .unread-badge {
    background: #ff3b30; color: #fff; border-radius: 20px;
    padding: 2px 8px; font-size: 12px; font-weight: bold;
    min-width: 22px; text-align: center;
  }

  .chat-screen { display: none; flex-direction: column; flex: 1; height: 100%; }
  .chat-header { padding: 16px 20px; background: #161a22; border-bottom: 1px solid #262b36; display: flex; align-items: center; gap: 15px; }
  .back-btn { background: transparent; border: none; color: #ff7a00; font-size: 24px; cursor: pointer; padding-right: 10px; }
 
  .chat-title-wrapper { display: flex; flex-direction: column; }
  .chat-title { font-weight: 600; font-size: 16px; }
 
  /* Текст "в сети" или "печатает" */
  .chat-substatus { font-size: 12px; height: 14px; display: none; }
  .chat-substatus.online { color: #22c55e; display: block; }
  .chat-substatus.typing { color: #ff7a00; display: block; }

  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .message.mine { align-self: flex-end; background: #ff7a00; color: #000; }
  .message.other { align-self: flex-start; background: #262b36; color: #fff; }
 
  .message .time { font-size: 10px; opacity: .6; display: inline-block; margin-left: 8px; float: right; margin-top: 4px; }
  .message .checks { font-size: 12px; margin-left: 4px; color: rgba(0,0,0,0.4); font-weight: bold; }
  .message .checks.read { color: #000; }
 
  .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
  .message .file-link { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: bold; margin-top: 5px; }
  .message.mine .file-link { color: #000; }
  .message.other .file-link { color: #fff; }
 
  .chat-input { display: flex; gap: 10px; padding: 16px 20px; background: #161a22; border-top: 1px solid #262b36; align-items: center; }
  .chat-input input[type="text"] { flex: 1; padding: 12px 14px; background: #0f1115; border: 1px solid #262b36; border-radius: 10px; color: #fff; font-size: 15px; }
  .chat-input input[type="text"]:focus { outline: none; border-color: #ff7a00; }
  .chat-input button { padding: 12px 22px; background: #ff7a00; border: none; border-radius: 10px; color: #000; font-weight: 600; cursor: pointer; }
 
  .attach-btn { background: transparent; border: none; font-size: 24px; cursor: pointer; color: #8a8f98; padding: 0 5px; transition: color 0.2s; }
  .attach-btn:hover { color: #ff7a00; }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h1>Мессенджер</h1>
  <input id="name" type="text" placeholder="Ваше имя (при регистрации)">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">
  <button id="loginBtn">Войти</button>
  <button id="signupBtn" class="secondary">Зарегистрироваться</button>
  <p class="status" id="status"></p>
</div>

<div class="app-container" id="appContainer">
  <div class="app-header">
    <span class="email" id="userEmail"></span>
    <button id="logoutBtn">Выйти</button>
  </div>

  <div class="contacts-screen" id="contactsScreen">
    <div class="search-box">
      <input id="searchEmail" type="email" placeholder="Введите Email собеседника...">
      <button id="searchBtn">Найти</button>
    </div>
    <h2 style="margin-bottom: 15px; font-size: 18px; color: #8a8f98;">Недавние чаты</h2>
    <div id="contactsList"></div>
  </div>

  <div class="chat-screen" id="chatScreen">
    <div class="chat-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="chat-title-wrapper">
        <span class="chat-title" id="chatTitle">Имя</span>
        <span class="chat-substatus" id="chatSubstatus">в сети</span>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-input">
      <button class="attach-btn" id="attachBtn" title="Прикрепить файл">📎</button>
      <input type="file" id="fileInput" style="display: none;" accept="image/*,application/pdf">
     
      <input id="messageInput" type="text" placeholder="Написать сообщение...">
      <button id="sendBtn">Отправить</button>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://nvjrhrebhlcnnxpjzylx.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52anJocmViaGxjbm54cGp6eWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3OTMyNTYsImV4cCI6MjExMDM2OTI1Nn0.BzdRl7PnKIa4HAw9jzPkptiAd9uN2xA_axIwCKdzLqE";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginBox = document.getElementById('loginBox');
  const appContainer = document.getElementById('appContainer');
  const contactsScreen = document.getElementById('contactsScreen');
  const contactsList = document.getElementById('contactsList');
  const chatScreen = document.getElementById('chatScreen');
  const chatTitle = document.getElementById('chatTitle');
  const chatSubstatus = document.getElementById('chatSubstatus');
  const messagesEl = document.getElementById('messages');
  const userEmail = document.getElementById('userEmail');
  const messageInput = document.getElementById('messageInput');
 
  let currentUser = null;
  let currentUserName = '';
  let currentRoomId = null;
  let currentReceiverId = null; // Храним ID собеседника для статуса
 
  let messageChannel = null;
  let globalChannel = null;
  let presenceChannel = null;
  let isLoadingChats = false;
  let typingTimeout = null;
 
  let onlineUsers = new Set(); // Здесь храним ID всех, кто сейчас онлайн

  // --- АВТОРИЗАЦИЯ ---
  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) document.getElementById('status').textContent = 'Ошибка: ' + error.message;
  };

  document.getElementById('signupBtn').onclick = async () => {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await supabase.auth.signUp({ email, password, options: { data: { name } } });
    if (error) document.getElementById('status').textContent = 'Ошибка: ' + error.message;
    else document.getElementById('status').textContent = 'Успешно! Теперь войдите.';
  };

  document.getElementById('logoutBtn').onclick = async () => {
    if (messageChannel) supabase.removeChannel(messageChannel);
    if (globalChannel) supabase.removeChannel(globalChannel);
    if (presenceChannel) supabase.removeChannel(presenceChannel); // Отключаем статус онлайн
    await supabase.auth.signOut();
  };

  // --- FIREBASE ---
  let messaging = null;
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getMessaging } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js");
    const firebaseConfig = {
      apiKey: "AIzaSyAk2qhmu4GJQozcU74_FNQWhzk4T7P-gPU",
      authDomain: "my-messenger-95eda.firebaseapp.com",
      projectId: "my-messenger-95eda",
      storageBucket: "my-messenger-95eda.firebasestorage.app",
      messagingSenderId: "327505492353",
      appId: "1:327505492353:web:3306144f22b8ac16eb9080"
    };
    const firebaseApp = initializeApp(firebaseConfig);
    messaging = getMessaging(firebaseApp);
  } catch (e) { console.log("Firebase не загрузился:", e); }

  // --- СЛЕЖИМ ЗА ВХОДОМ ---
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      currentUser = session.user;
      currentUserName = currentUser.user_metadata.name || currentUser.email;
     
      loginBox.style.display = 'none';
      appContainer.style.display = 'flex';
      userEmail.textContent = currentUserName;

      loadRecentChats();
      setupGlobalListener();
      setupPresence(); // Включаем "Онлайн" статус
      if (messaging) setupNotifications();
    } else {
      currentUser = null;
      currentUserName = '';
      onlineUsers.clear();
      loginBox.style.display = 'block';
      appContainer.style.display = 'none';
      chatScreen.style.display = 'none';
      contactsScreen.style.display = 'block';
      contactsList.innerHTML = '';
    }
  });

  // --- ПРИСУТСТВИЕ (ONLINE СТАТУС) ---
  function setupPresence() {
    if (presenceChannel) supabase.removeChannel(presenceChannel);
   
    presenceChannel = supabase.channel('online-users', {
      config: { presence: { key: currentUser.id } }
    });

    presenceChannel
      .on('presence', { event: 'sync' }, () => {
        const state = presenceChannel.presenceState();
        onlineUsers.clear();
        for (const id in state) {
          onlineUsers.add(id);
        }
        updateOnlineUI(); // Обновляем интерфейс при изменении
      })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          // Сообщаем всем, что мы онлайн
          await presenceChannel.track({ online_at: new Date().toISOString() });
        }
      });
  }

  // Функция обновления зеленых кружочков и текста
  function updateOnlineUI() {
    // 1. Обновляем список контактов
    if (contactsScreen.style.display !== 'none') {
      const items = contactsList.querySelectorAll('.contact-item');
      items.forEach(item => {
        const userId = item.dataset.id;
        const dot = item.querySelector('.online-dot');
        if (dot) {
          dot.style.display = onlineUsers.has(userId) ? 'block' : 'none';
        }
      });
    }

    // 2. Обновляем шапку чата (если мы внутри чата)
    if (chatScreen.style.display !== 'none' && currentReceiverId) {
      if (onlineUsers.has(currentReceiverId)) {
        if (chatSubstatus.classList.contains('typing')) return; // Если печатает, не перебиваем
        chatSubstatus.textContent = 'в сети';
        chatSubstatus.className = 'chat-substatus online';
      } else {
        if (chatSubstatus.classList.contains('typing')) return;
        chatSubstatus.className = 'chat-substatus'; // Скрываем
      }
    }
  }

  function setupGlobalListener() {
    if (globalChannel) supabase.removeChannel(globalChannel);
    globalChannel = supabase.channel('global-messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
        if (contactsScreen.style.display !== 'none' && payload.new.uid !== currentUser.id) loadRecentChats();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, () => {
        if (contactsScreen.style.display !== 'none') loadRecentChats();
      })
      .subscribe();
  }

  document.getElementById('searchBtn').onclick = async () => {
    const emailToFind = document.getElementById('searchEmail').value.trim();
    if (!emailToFind) return;
    const { data, error } = await supabase.from('profiles').select('*').eq('email', emailToFind).limit(1);
    if (error || !data || data.length === 0) { alert('Пользователь не найден!'); return; }
    const user = data[0];
    if (user.id === currentUser.id) { alert('Это ваш email!'); return; }
    document.getElementById('searchEmail').value = '';
    openChat(user.id, user.name || user.email);
  };

  async function loadRecentChats() {
    if (isLoadingChats) return;
    isLoadingChats = true;
    contactsList.innerHTML = '<p style="color:#8a8f98; font-size:14px;">Загрузка...</p>';
   
    try {
      const { data: messages, error } = await supabase.from('messages').select('room_id, uid, is_read').like('room_id', `%${currentUser.id}%`);
      if (error) throw error;

      const unreadCounts = {};
      messages.forEach(msg => {
        if (msg.uid !== currentUser.id && !msg.is_read) {
          unreadCounts[msg.room_id] = (unreadCounts[msg.room_id] || 0) + 1;
        }
      });

      const uniqueRooms = [...new Set(messages.map(m => m.room_id))];
      const fragment = document.createDocumentFragment();
     
      if (uniqueRooms.length === 0) {
        const p = document.createElement('p');
        p.style.color = '#8a8f98';
        p.style.fontSize = '14px';
        p.textContent = 'У вас пока нет переписок. Найдите собеседника по Email выше.';
        fragment.appendChild(p);
      } else {
        for (const room of uniqueRooms) {
          const usersInRoom = room.split('_');
          const otherUserId = usersInRoom.find(id => id !== currentUser.id);
         
          let displayName = 'Собеседник';
          let initial = '?';
          const { data: profileData } = await supabase.rpc('get_contact_profile', { other_user_id: otherUserId });
          if (profileData && profileData.length > 0) {
            displayName = profileData[0].name || profileData[0].email;
            initial = displayName.charAt(0).toUpperCase();
          }

          const unreadCount = unreadCounts[room] || 0;
          const isOnline = onlineUsers.has(otherUserId); // Проверяем статус
         
          const div = document.createElement('div');
          div.className = 'contact-item';
          div.dataset.id = otherUserId; // Сохраняем ID для быстрого обновления
         
          div.innerHTML = `
            <div class="avatar-wrapper">
              <div class="contact-avatar">${initial}</div>
              <div class="online-dot" style="display: ${isOnline ? 'block' : 'none'}"></div>
            </div>
            <div class="contact-info">
              <div class="contact-name">${displayName}</div>
            </div>
            ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
          `;
          div.onclick = () => openChat(otherUserId, displayName);
          fragment.appendChild(div);
        }
      }
      contactsList.innerHTML = '';
      contactsList.appendChild(fragment);
    } catch (err) {
      console.error(err);
    } finally {
      isLoadingChats = false;
    }
  }

  function openChat(receiverId, receiverName) {
    chatTitle.textContent = receiverName;
    currentReceiverId = receiverId; // Запоминаем ID собеседника
   
    // Сбрасываем статус перед проверкой
    chatSubstatus.className = 'chat-substatus';
    updateOnlineUI(); // Сразу проверяем, онлайн ли он

    const ids = [currentUser.id, receiverId].sort();
    currentRoomId = `${ids[0]}_${ids[1]}`;

    contactsScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    messagesEl.innerHTML = '';
    loadMessages();
    markMessagesAsRead();
  }

  document.getElementById('backBtn').onclick = () => {
    if (messageChannel) supabase.removeChannel(messageChannel);
    chatScreen.style.display = 'none';
    contactsScreen.style.display = 'block';
    currentRoomId = null;
    currentReceiverId = null;
    loadRecentChats(); // Перерисовываем список, чтобы обновить кружочки
  };

  async function markMessagesAsRead() {
    if (!currentRoomId || !currentUser) return;
    await supabase.from('messages').update({ is_read: true }).eq('room_id', currentRoomId).neq('uid', currentUser.id).eq('is_read', false);
  }

  function loadMessages() {
    if (messageChannel) supabase.removeChannel(messageChannel);

    supabase.from('messages').select('*').eq('room_id', currentRoomId).order('created_at', { ascending: true })
      .then(({ data, error }) => {
        if (error) { console.error(error); return; }
        messagesEl.innerHTML = '';
        data.forEach(renderMessage);
        scrollToBottom();
      });

    messageChannel = supabase.channel(`room:${currentRoomId}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${currentRoomId}` },
        (payload) => {
          renderMessage(payload.new);
          scrollToBottom();
          hideTypingStatus(); // Пришло сообщение — сбрасываем "печатает"
          if (payload.new.uid !== currentUser.id) markMessagesAsRead();
        }
      )
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `room_id=eq.${currentRoomId}` },
        (payload) => {
           const msgDiv = document.getElementById(`msg-${payload.new.id}`);
           if (msgDiv) {
               const checks = msgDiv.querySelector('.checks');
               if (checks && payload.new.is_read) {
                   checks.innerHTML = '✓✓';
                   checks.classList.add('read');
               }
           }
        }
      )
      .on('broadcast', { event: 'typing' }, (payload) => {
          if (payload.payload.userId !== currentUser.id) {
              if (payload.payload.isTyping) {
                  chatSubstatus.textContent = 'печатает...';
                  chatSubstatus.className = 'chat-substatus typing';
              } else {
                  hideTypingStatus();
              }
          }
      })
      .subscribe();
  }

  function hideTypingStatus() {
      if (currentReceiverId && onlineUsers.has(currentReceiverId)) {
          chatSubstatus.textContent = 'в сети';
          chatSubstatus.className = 'chat-substatus online';
      } else {
          chatSubstatus.className = 'chat-substatus';
      }
  }

  // --- ЛОГИКА "ПЕЧАТАЕТ" ---
  messageInput.addEventListener('input', () => {
    if (!messageChannel) return;
    messageChannel.send({ type: 'broadcast', event: 'typing', payload: { userId: currentUser.id, isTyping: true } });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
        messageChannel.send({ type: 'broadcast', event: 'typing', payload: { userId: currentUser.id, isTyping: false } });
    }, 2000);
  });

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentRoomId) return;
    messageInput.value = '';
    messageChannel.send({ type: 'broadcast', event: 'typing', payload: { userId: currentUser.id, isTyping: false } });
    clearTimeout(typingTimeout);

    await supabase.from('messages').insert({
      room_id: currentRoomId, text: text, author: currentUserName, uid: currentUser.id, message_type: 'text', is_read: false
    });
  }

  document.getElementById('sendBtn').onclick = sendMessage;
  messageInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  attachBtn.onclick = () => fileInput.click();

  fileInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file || !currentRoomId) return;
    messagesEl.innerHTML += '<div class="message other" id="loadingMsg">Загрузка файла...</div>';
    scrollToBottom();
    try {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
      const filePath = `${currentRoomId}/${fileName}`;
      const { error: uploadError } = await supabase.storage.from('chat_files').upload(filePath, file);
      if (uploadError) throw uploadError;
      const { data: { publicUrl } } = supabase.storage.from('chat_files').getPublicUrl(filePath);
      const isImage = file.type.startsWith('image/');
      await supabase.from('messages').insert({
        room_id: currentRoomId, text: publicUrl, file_name: file.name, author: currentUserName, uid: currentUser.id, message_type: isImage ? 'image' : 'file', is_read: false
      });
    } catch (err) {
      alert('Ошибка загрузки: ' + err.message);
    } finally {
      fileInput.value = '';
      const loading = document.getElementById('loadingMsg');
      if (loading) loading.remove();
    }
  };

  function renderMessage(msg) {
    const div = document.createElement('div');
    div.className = 'message ' + (msg.uid === currentUser.id ? 'mine' : 'other');
    div.id = `msg-${msg.id}`;
    let timeStr = '';
    if (msg.created_at) {
      const date = new Date(msg.created_at);
      timeStr = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }
    let checksHtml = '';
    if (msg.uid === currentUser.id) checksHtml = msg.is_read ? `<span class="checks read">✓✓</span>` : `<span class="checks">✓</span>`;
   
    let contentHtml = '';
    if (msg.message_type === 'image') {
      contentHtml = `<img src="${msg.text}" alt="Картинка" onload="scrollToBottom()"><span class="time">${timeStr}${checksHtml}</span>`;
    } else if (msg.message_type === 'file') {
      let fileName = msg.file_name || 'Файл';
      contentHtml = `<a href="${msg.text}" target="_blank" class="file-link">📎 ${fileName}</a><span class="time">${timeStr}${checksHtml}</span>`;
    } else {
      contentHtml = `${msg.text}<span class="time">${timeStr}${checksHtml}</span>`;
    }
    div.innerHTML = contentHtml;
    messagesEl.appendChild(div);
  }

  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  async function setupNotifications() {
    if (Notification.permission === 'default') await Notification.requestPermission();
    if (Notification.permission !== 'granted') return;
    try {
      const { getToken } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js");
      const swRegistration = await navigator.serviceWorker.register('service-worker.js');
      const currentToken = await getToken(messaging, {
        vapidKey: "BPnA8s44lJWJsYJdM303Uqpyx0jNgkKD0X_ywGKnnXFU1DB9spqNCP2iQRQNi_a4Q8C1UkGl_NzBgBvZb6-kTy8",
        serviceWorkerRegistration: swRegistration
      });
      if (currentToken) {
        const { data: existingToken } = await supabase.from('push_tokens').select('id').eq('token', currentToken).limit(1);
        if (!existingToken || existingToken.length === 0) {
          await supabase.from('push_tokens').insert({ user_id: currentUser.id, token: currentToken });
        }
      }
    } catch (err) { console.error(err); }
  }

  const urlParams = new URLSearchParams(window.location.search);
  const roomIdFromUrl = urlParams.get('room');
  const senderIdFromUrl = urlParams.get('sender');

  if (roomIdFromUrl && senderIdFromUrl) {
    const checkAuth = setInterval(() => {
      if (currentUser) {
        clearInterval(checkAuth);
        supabase.rpc('get_contact_profile', { other_user_id: senderIdFromUrl }).then(({data}) => {
           let name = 'Собеседник';
           if (data && data.length > 0) name = data[0].name || data[0].email;
           openChat(senderIdFromUrl, name);
        });
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }, 500);
  }
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(err => console.log(err));
  }
</script>
