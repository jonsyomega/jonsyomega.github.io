<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мессенджер</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0f1115;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* Форма входа */
  .login-box {
    width: 100%;
    max-width: 420px;
    margin: auto;
    background: #161a22;
    border: 1px solid #262b36;
    border-radius: 16px;
    padding: 28px;
  }
  .login-box h1 { font-size: 22px; margin-bottom: 16px; text-align: center; }
  .login-box input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    background: #0f1115;
    border: 1px solid #262b36;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
  }
  .login-box input:focus { outline: none; border-color: #ff7a00; }
  .login-box button {
    width: 100%;
    padding: 13px;
    background: #ff7a00;
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .login-box button:hover { opacity: .85; }
  .status {
    margin-top: 16px;
    font-size: 13px;
    color: #8a8f98;
    text-align: center;
    min-height: 18px;
  }

  /* Чат */
  .chat {
    display: none;
    flex-direction: column;
    height: 100vh;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    background: #0f1115;
  }
  .chat-header {
    padding: 16px 20px;
    background: #161a22;
    border-bottom: 1px solid #262b36;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-header .email { font-size: 14px; color: #8a8f98; }
  .chat-header button {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid #262b36;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  .chat-header button:hover { border-color: #ff7a00; color: #ff7a00; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .message.mine {
    align-self: flex-end;
    background: #ff7a00;
    color: #000;
  }
  .message.other {
    align-self: flex-start;
    background: #262b36;
    color: #fff;
  }
  .message .author {
    font-size: 11px;
    opacity: .7;
    display: block;
    margin-bottom: 4px;
  }
  .message .time {
    font-size: 10px;
    opacity: .6;
    display: block;
    margin-top: 4px;
    text-align: right;
  }

  .chat-input {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    background: #161a22;
    border-top: 1px solid #262b36;
  }
  .chat-input input {
    flex: 1;
    padding: 12px 14px;
    background: #0f1115;
    border: 1px solid #262b36;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
  }
  .chat-input input:focus { outline: none; border-color: #ff7a00; }
  .chat-input button {
    padding: 12px 22px;
    background: #ff7a00;
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 600;
    cursor: pointer;
  }
  .chat-input button:hover { opacity: .85; }
</style>
</head>
<body>

<!-- Форма входа -->
<div class="login-box" id="loginBox">
  <h1>Мессенджер</h1>
  <input id="name" type="text" placeholder="Ваше имя (при регистрации)">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">
  <button id="loginBtn">Войти / Зарегистрироваться</button>
  <p class="status" id="status"></p>
</div>

<!-- Чат -->
<div class="chat" id="chat">
  <div class="chat-header">
    <span class="email" id="userEmail"></span>
    <button id="logoutBtn">Выйти</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chat-input">
    <input id="messageInput" type="text" placeholder="Написать сообщение...">
    <button id="sendBtn">Отправить</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, onSnapshot,
    serverTimestamp, doc, setDoc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

  // Твой конфиг
  const firebaseConfig = {
    apiKey: "AIzaSyAk2qhmu4GJQozcU74_FNQWhzk4T7P-gPU",
    authDomain: "my-messenger-95eda.firebaseapp.com",
    projectId: "my-messenger-95eda",
    storageBucket: "my-messenger-95eda.firebasestorage.app",
    messagingSenderId: "327505492353",
    appId: "1:327505492353:web:3306144f22b8ac16eb9080"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const messaging = getMessaging(app);

  // Элементы
  const loginBox = document.getElementById('loginBox');
  const chat = document.getElementById('chat');
  const status = document.getElementById('status');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userEmail = document.getElementById('userEmail');
  const messagesEl = document.getElementById('messages');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  let currentUserName = '';

  // Вход / регистрация
  loginBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { status.textContent = 'Введите email и пароль'; return; }

    status.textContent = 'Подождите...';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if (name) {
          await setDoc(doc(db, 'users', cred.user.uid), { name, email });
        }
      } catch (err) {
        status.textContent = 'Ошибка: ' + err.message;
      }
    }
  });

  // Выход
  logoutBtn.addEventListener('click', () => signOut(auth));

  // Отправка
  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !auth.currentUser) return;
    messageInput.value = '';
    await addDoc(collection(db, 'messages'), {
      text,
      author: currentUserName || auth.currentUser.email,
      uid: auth.currentUser.uid,
      createdAt: serverTimestamp()
    });
  }
  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  // Следим за авторизацией
  onAuthStateChanged(auth, async user => {
    if (user) {
      loginBox.style.display = 'none';
      chat.style.display = 'flex';

      // Подтягиваем имя из профиля
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (userDoc.exists() && userDoc.data().name) {
        currentUserName = userDoc.data().name;
      } else {
        currentUserName = user.email;
      }
      userEmail.textContent = 'Вы вошли как ' + currentUserName;

      // Запрос разрешения на уведомления
      if (Notification.permission === 'default') {
        await Notification.requestPermission();
      }
      if (Notification.permission === 'granted') {
        try {
          // Регистрируем service worker для FCM
          const swRegistration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
          console.log('FCM Service Worker зарегистрирован:', swRegistration);

          const currentToken = await getToken(messaging, {
            vapidKey: "BPnA8s44lJWJsYJdM303Uqpyx0jNgkKD0X_ywGKnnXFU1DB9spqNCP2iQRQNi_a4Q8C1UkGl_NzBgBvZb6-kTy8",
            serviceWorkerRegistration: swRegistration
          });

          if (currentToken) {
            console.log('Токен для уведомлений:', currentToken);
          }
        } catch (err) {
          console.log('Ошибка получения токена:', err);
        }
      }

      // Подписка на сообщения
      const q = query(collection(db, 'messages'), orderBy('createdAt'));
      onSnapshot(q, snapshot => {
        messagesEl.innerHTML = '';
        snapshot.forEach(d => {
          const data = d.data();
          const div = document.createElement('div');
          div.className = 'message ' + (data.uid === user.uid ? 'mine' : 'other');

          let timeStr = '';
          if (data.createdAt) {
            const date = data.createdAt.toDate();
            timeStr = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
          }

          div.innerHTML = `
            <span class="author">${data.author}</span>
            ${data.text}
            <span class="time">${timeStr}</span>
          `;
          messagesEl.appendChild(div);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    } else {
      loginBox.style.display = 'block';
      chat.style.display = 'none';
      userEmail.textContent = '';
      currentUserName = '';
    }
  });

  // Уведомление, когда приложение открыто
  onMessage(messaging, (payload) => {
    console.log('Сообщение на переднем плане:', payload);
    new Notification(payload.notification?.title || 'Новое сообщение', {
      body: payload.notification?.body || ''
    });
  });
</script>

<script>
  // Регистрируем обычный PWA service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Service Worker зарегистрирован'))
      .catch(err => console.log('Ошибка Service Worker:', err));
  }
</script>

</body>
</html>
